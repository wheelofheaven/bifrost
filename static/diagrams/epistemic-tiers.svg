<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" role="img" aria-labelledby="ep-t ep-d" class="dg dg--pyramid">
  <title id="ep-t">The four-tier epistemic distinction</title>
  <desc id="ep-d">A pyramid of four content tiers the corpus keeps separate: direct source claims at the firm base, then comparative observations, then Wheel of Heaven interpretation, with open questions at the interpretive capstone.</desc>
  <polygon points="310.0,34.0 372.5,123.5 247.5,123.5" fill="none" class="dg-muted-line" stroke-dasharray="5 4"/>
  <text x="310.0" y="113.5" text-anchor="middle" class="dg-label" font-size="13" font-weight="600">Open questions</text>
  <polygon points="247.5,123.5 372.5,123.5 435.0,213.0 185.0,213.0" class="dg-tier dg-tier-3"/>
  <text x="310.0" y="164.2" text-anchor="middle" class="dg-label" font-size="14" font-weight="600">Wheel of Heaven interpretation</text>
  <text x="310.0" y="183.2" text-anchor="middle" class="dg-label--muted" font-size="11.5">corpus-level synthesis, marked as such</text>
  <polygon points="185.0,213.0 435.0,213.0 497.5,302.5 122.5,302.5" class="dg-tier dg-tier-2"/>
  <text x="310.0" y="253.8" text-anchor="middle" class="dg-label" font-size="14" font-weight="600">Comparative observations</text>
  <text x="310.0" y="272.8" text-anchor="middle" class="dg-label--muted" font-size="11.5">patterns noted across traditions</text>
  <polygon points="122.5,302.5 497.5,302.5 560.0,392.0 60.0,392.0" class="dg-tier dg-tier-1"/>
  <text x="310.0" y="343.2" text-anchor="middle" class="dg-label" font-size="14" font-weight="600">Direct source claims</text>
  <text x="310.0" y="362.2" text-anchor="middle" class="dg-label--muted" font-size="11.5">what a source itself asserts</text>
  <line x1="54" y1="392.0" x2="54" y2="40.0" class="dg-muted-line"/>
  <path d="M 50 48.0 L 54 39.0 L 58 48.0 Z" class="dg-now"/>
  <text x="62" y="392.0" text-anchor="start" class="dg-mono">firmest</text>
  <text x="62" y="52.0" text-anchor="start" class="dg-mono">most interpretive</text>
</svg>
