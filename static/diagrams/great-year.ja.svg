<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="gy-t gy-d" class="dg dg--wheel">
  <title id="gy-t">十二の時代の輪としての大年</title>
  <desc id="gy-d">約25,772年の歳差周期を、各約2,160年の十二の時代に分けたもので、黄道十二宮の各宮に一つずつ対応します。春分点は72年におよそ1度の割合で黄道帯を逆行し、現在は魚座とみずがめ座の境界に位置し、みずがめ座の時代へと入りつつあります。</desc>
