<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 710" role="img" aria-labelledby="tbn-t tbn-d" class="dg dg--timeline-narrow">
  <title id="tbn-t">年表としての歳差時代の枠組み</title>
  <desc id="tbn-d">山羊座の時代(紀元前約21,810年、プロジェクト開始)から、みずがめ座の時代(西暦1950年から、現在の時代)まで続く、各約2,160年の連続する十二の歳差時代で、それぞれに黄道十二宮の記号を付しています。</desc>
