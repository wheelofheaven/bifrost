<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="cw-t cw-d" class="dg dg--creation-week">
  <title id="cw-t">The six creation days of Genesis 1</title>
  <desc id="cw-d">Diagram of the six creation days as successive working stages of about two thousand years each: the survey of the planet and its light; the work beneath the clouds; the single continent and the first plants; the study of the sky; life in the seas and the air; land animals and humankind.</desc>
  <defs>
    <symbol id="cw-i-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.6"/><path d="M12 3.5v2.4M12 18.1v2.4M3.5 12h2.4M18.1 12h2.4M6 6l1.7 1.7M16.3 16.3 18 18M6 18l1.7-1.7M16.3 7.7 18 6"/></symbol>
    <symbol id="cw-i-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 10.5H17a2.7 2.7 0 0 0-.5-5.4A4 4 0 0 0 9 4.6a3 3 0 0 0-2.5 5.9Z"/><path d="M3 16q2.25-2 4.5 0t4.5 0 4.5 0 4.5 0M3 20q2.25-2 4.5 0t4.5 0 4.5 0 4.5 0"/></symbol>
    <symbol id="cw-i-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 20.5h19M4 20.5Q8 14.5 12 15t8 5.5"/><path d="M12 15V9.5M12 12Q8.2 12 8.2 8.2 12 8.2 12 12M12 10.5q3.8 0 3.8-3.8-3.8 0-3.8 3.8"/></symbol>
    <symbol id="cw-i-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5a7.5 7.5 0 1 0 5 11 6 6 0 0 1-5-11Z"/><path d="M6 3.5v4M4 5.5h4"/></symbol>
    <symbol id="cw-i-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17q5-5 10 0-5 5-10 0Z"/><path d="m13 17 3.5-3v6Z"/><path d="M9.5 7.5q2.5-3 4.75 0 2.25-3 4.75 0"/></symbol>
    <symbol id="cw-i-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12.5h7.5l1.5-2.5M4 12.5V19M9.5 12.5V19"/><circle cx="17.5" cy="5.2" r="1.9"/><path d="M17.5 7.6v6.4M17.5 14l-2.6 5.5M17.5 14l2.6 5.5M14.6 10.2h5.8"/></symbol>
  </defs>
  <rect x="15.0" y="14.0" width="110.0" height="150.0" rx="8" class="dg-tile dg-day-0"/>
  <rect x="15.0" y="14.0" width="110.0" height="4" rx="2" class="dg-day-bar-0"/>
  <text x="70.0" y="38.0" text-anchor="middle" class="dg-mono">Day 1 · 1:1–5</text>
  <use href="#cw-i-0" x="53.0" y="50.0" width="34.0" height="34.0" class="dg-glyph dg-day-ink-0"/>
  <text x="70.0" y="110.0" text-anchor="middle" class="dg-label" font-size="13">The survey</text>
  <text x="70.0" y="126.0" text-anchor="middle" class="dg-label" font-size="13">and the light</text>
  <rect x="131.0" y="14.0" width="110.0" height="150.0" rx="8" class="dg-tile dg-day-1"/>
  <rect x="131.0" y="14.0" width="110.0" height="4" rx="2" class="dg-day-bar-1"/>
  <text x="186.0" y="38.0" text-anchor="middle" class="dg-mono">Day 2 · 1:6–8</text>
  <use href="#cw-i-1" x="169.0" y="50.0" width="34.0" height="34.0" class="dg-glyph dg-day-ink-1"/>
  <text x="186.0" y="110.0" text-anchor="middle" class="dg-label" font-size="13">The waters</text>
  <text x="186.0" y="126.0" text-anchor="middle" class="dg-label" font-size="13">and the</text>
  <text x="186.0" y="142.0" text-anchor="middle" class="dg-label" font-size="13">clouds</text>
  <rect x="247.0" y="14.0" width="110.0" height="150.0" rx="8" class="dg-tile dg-day-2"/>
  <rect x="247.0" y="14.0" width="110.0" height="4" rx="2" class="dg-day-bar-2"/>
  <text x="302.0" y="38.0" text-anchor="middle" class="dg-mono">Day 3 · 1:9–13</text>
  <use href="#cw-i-2" x="285.0" y="50.0" width="34.0" height="34.0" class="dg-glyph dg-day-ink-2"/>
  <text x="302.0" y="110.0" text-anchor="middle" class="dg-label" font-size="13">One continent</text>
  <text x="302.0" y="126.0" text-anchor="middle" class="dg-label" font-size="13">and the first</text>
  <text x="302.0" y="142.0" text-anchor="middle" class="dg-label" font-size="13">plants</text>
  <rect x="363.0" y="14.0" width="110.0" height="150.0" rx="8" class="dg-tile dg-day-3"/>
  <rect x="363.0" y="14.0" width="110.0" height="4" rx="2" class="dg-day-bar-3"/>
  <text x="418.0" y="38.0" text-anchor="middle" class="dg-mono">Day 4 · 1:14–19</text>
  <use href="#cw-i-3" x="401.0" y="50.0" width="34.0" height="34.0" class="dg-glyph dg-day-ink-3"/>
  <text x="418.0" y="110.0" text-anchor="middle" class="dg-label" font-size="13">Reading the</text>
  <text x="418.0" y="126.0" text-anchor="middle" class="dg-label" font-size="13">sky</text>
  <rect x="479.0" y="14.0" width="110.0" height="150.0" rx="8" class="dg-tile dg-day-4"/>
  <rect x="479.0" y="14.0" width="110.0" height="4" rx="2" class="dg-day-bar-4"/>
  <text x="534.0" y="38.0" text-anchor="middle" class="dg-mono">Day 5 · 1:20–23</text>
  <use href="#cw-i-4" x="517.0" y="50.0" width="34.0" height="34.0" class="dg-glyph dg-day-ink-4"/>
  <text x="534.0" y="110.0" text-anchor="middle" class="dg-label" font-size="13">Life in the</text>
  <text x="534.0" y="126.0" text-anchor="middle" class="dg-label" font-size="13">seas and the</text>
  <text x="534.0" y="142.0" text-anchor="middle" class="dg-label" font-size="13">air</text>
  <rect x="595.0" y="14.0" width="110.0" height="150.0" rx="8" class="dg-tile dg-day-5"/>
  <rect x="595.0" y="14.0" width="110.0" height="4" rx="2" class="dg-day-bar-5"/>
  <text x="650.0" y="38.0" text-anchor="middle" class="dg-mono">Day 6 · 1:24–31</text>
  <use href="#cw-i-5" x="633.0" y="50.0" width="34.0" height="34.0" class="dg-glyph dg-day-ink-5"/>
  <text x="650.0" y="110.0" text-anchor="middle" class="dg-label" font-size="13">Land animals</text>
  <text x="650.0" y="126.0" text-anchor="middle" class="dg-label" font-size="13">and humankind</text>
  <line x1="15.0" y1="182.0" x2="705.0" y2="182.0" class="dg-ruler"/>
  <line x1="15.0" y1="177.0" x2="15.0" y2="187.0" class="dg-ruler"/>
  <line x1="128.0" y1="177.0" x2="128.0" y2="187.0" class="dg-ruler"/>
  <line x1="244.0" y1="177.0" x2="244.0" y2="187.0" class="dg-ruler"/>
  <line x1="360.0" y1="177.0" x2="360.0" y2="187.0" class="dg-ruler"/>
  <line x1="476.0" y1="177.0" x2="476.0" y2="187.0" class="dg-ruler"/>
  <line x1="592.0" y1="177.0" x2="592.0" y2="187.0" class="dg-ruler"/>
  <line x1="705.0" y1="177.0" x2="705.0" y2="187.0" class="dg-ruler"/>
  <text x="70.0" y="200.0" text-anchor="middle" class="dg-mono dg-mono--ink">≈ 2,000 yrs</text>
  <text x="186.0" y="200.0" text-anchor="middle" class="dg-mono dg-mono--ink">≈ 2,000 yrs</text>
  <text x="302.0" y="200.0" text-anchor="middle" class="dg-mono dg-mono--ink">≈ 2,000 yrs</text>
  <text x="418.0" y="200.0" text-anchor="middle" class="dg-mono dg-mono--ink">≈ 2,000 yrs</text>
  <text x="534.0" y="200.0" text-anchor="middle" class="dg-mono dg-mono--ink">≈ 2,000 yrs</text>
  <text x="650.0" y="200.0" text-anchor="middle" class="dg-mono dg-mono--ink">≈ 2,000 yrs</text>
  <text x="360.0" y="228.0" text-anchor="middle" class="dg-label" font-size="13" font-weight="600">Canon: each day ≈ 2,000 Earth years <tspan class="dg-mono" font-weight="400">· TBWTT 2:10</tspan></text>
  <text x="360.0" y="246.0" text-anchor="middle" class="dg-label--muted" font-size="12">A “day”: the sun rises under the same sign at the spring equinox</text>
  <line x1="15.0" y1="274.0" x2="52.0" y2="274.0" class="dg-framework-line"/>
  <text x="60.0" y="278.0" class="dg-framework-text" font-size="11.5">Wheel of Heaven model (framework, claim 0059): ≈ 2,160 years per day</text>
