<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" role="img" aria-labelledby="pr-t pr-d" class="dg dg--precession">
  <title id="pr-t">地轴岁差</title>
  <desc id="pr-d">地球自转轴相对黄道法线倾斜 23.4 度，并缓慢扫过一个完整的圆锥，因此北天极相对于恒星背景描绘出一个圆——约公元前 2800 年经过右枢，如今为北极星，约公元 13,700 年将为织女星。</desc>
  <g class="dg-star"><circle cx="96" cy="64" r="1.6"/><circle cx="470" cy="40" r="1.4"/><circle cx="560" cy="128" r="1.8"/><circle cx="606" cy="74" r="1.3"/><circle cx="84" cy="170" r="1.5"/><circle cx="520" cy="196" r="1.4"/><circle cx="150" cy="104" r="1.3"/><circle cx="620" cy="250" r="1.2"/><circle cx="40" cy="300" r="1.4"/><circle cx="590" cy="360" r="1.5"/><circle cx="110" cy="390" r="1.2"/><circle cx="470" cy="300" r="1.1"/></g>
  <path d="M 300 362 L 196 120 M 300 362 L 404 120" class="dg-hair" fill="none"/>
  <ellipse cx="300" cy="120" rx="104" ry="34" class="dg-cone" />
  <line x1="300" y1="362" x2="300" y2="62" class="dg-muted-line" stroke-dasharray="5 5"/>
  <text x="300" y="48" text-anchor="middle" class="dg-mono">黄道法线</text>
  <ellipse cx="300" cy="120" rx="104" ry="34" class="dg-accent-line" fill="none" stroke-dasharray="5 5"/>
  <path d="M 302 149 L 313 154 L 302 159 Z" class="dg-now"/>
  <line x1="300" y1="362" x2="399" y2="110" class="dg-axis-line"/>
  <text x="363.5" y="236" class="dg-label--muted" font-size="13">地球</text>
  <text x="356.8" y="253" class="dg-label--muted" font-size="13">自转轴</text>
  <path d="M 300 304 A 58 58 0 0 1 323.0 308.8" fill="none" class="dg-muted-line"/>
  <text x="330" y="298" class="dg-label" font-size="13.5" font-weight="600">23.4°</text>
  <circle cx="300" cy="362" r="32" class="dg-earth"/>
  <ellipse cx="300" cy="362" rx="32" ry="9" fill="none" class="dg-hair" transform="rotate(23.4 300 362)"/>
  <circle cx="202" cy="132" r="4.5" class="dg-star-mark"/>
  <text x="190" y="134" text-anchor="end" class="dg-label" font-size="15">右枢</text>
  <text x="190" y="151" text-anchor="end" class="dg-mono">≈ 公元前 2800 年</text>
  <circle cx="260" cy="88" r="4.5" class="dg-star-mark"/>
  <text x="250" y="62" text-anchor="end" class="dg-label" font-size="15">织女星</text>
  <text x="250" y="78" text-anchor="end" class="dg-mono">≈ 公元 13,700 年</text>
  <circle cx="399" cy="110" r="11" class="dg-now-halo"/>
  <circle cx="399" cy="110" r="5.5" class="dg-now"/>
  <text x="417" y="108" class="dg-label--now" font-size="15" font-weight="600">北极星</text>
  <text x="417" y="125" class="dg-mono">当今北极星</text>
</svg>
