<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" role="img" aria-labelledby="ep-t ep-d" class="dg dg--pyramid">
  <title id="ep-t">La distinction épistémique à quatre niveaux</title>
  <desc id="ep-d">Une pyramide de quatre niveaux de contenu que le corpus tient séparés : les assertions directes des sources à la base solide, puis les observations comparées, puis l'interprétation Wheel of Heaven, avec les questions ouvertes au faîte interprétatif.</desc>
  <polygon points="310.0,34.0 372.5,123.5 247.5,123.5" fill="none" class="dg-muted-line" stroke-dasharray="5 4"/>
  <text x="310.0" y="113.5" text-anchor="middle" class="dg-label" font-size="13" font-weight="600">Questions ouvertes</text>
  <polygon points="247.5,123.5 372.5,123.5 435.0,213.0 185.0,213.0" class="dg-tier dg-tier-3"/>
  <text x="310.0" y="164.2" text-anchor="middle" class="dg-label" font-size="14" font-weight="600">Interprétation Wheel of Heaven</text>
  <text x="310.0" y="183.2" text-anchor="middle" class="dg-label--muted" font-size="11.5">synthèse au niveau du corpus, marquée comme telle</text>
  <polygon points="185.0,213.0 435.0,213.0 497.5,302.5 122.5,302.5" class="dg-tier dg-tier-2"/>
  <text x="310.0" y="253.8" text-anchor="middle" class="dg-label" font-size="14" font-weight="600">Observations comparées</text>
  <text x="310.0" y="272.8" text-anchor="middle" class="dg-label--muted" font-size="11.5">motifs relevés à travers les traditions</text>
  <polygon points="122.5,302.5 497.5,302.5 560.0,392.0 60.0,392.0" class="dg-tier dg-tier-1"/>
  <text x="310.0" y="343.2" text-anchor="middle" class="dg-label" font-size="14" font-weight="600">Assertions directes des sources</text>
  <text x="310.0" y="362.2" text-anchor="middle" class="dg-label--muted" font-size="11.5">ce qu'une source affirme elle-même</text>
  <line x1="54" y1="392.0" x2="54" y2="40.0" class="dg-muted-line"/>
  <path d="M 50 48.0 L 54 39.0 L 58 48.0 Z" class="dg-now"/>
  <text x="62" y="392.0" text-anchor="start" class="dg-mono">le plus solide</text>
  <text x="62" y="52.0" text-anchor="start" class="dg-mono">le plus interprétatif</text>
</svg>
