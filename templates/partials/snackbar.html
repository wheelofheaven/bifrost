{# Snackbar Component Usage: {% include "partials/snackbar.html" %} This creates
a global snackbar container that can be used to show notifications. Call
showSnackbar(message, type, duration) from JavaScript to display notifications.
#}

<div
    id="snackbar-container"
    class="snackbar-container"
    aria-live="polite"
    aria-atomic="true"
>
    <!-- Snackbar notifications will be dynamically inserted here -->
</div>

<script>
    // Ensure snackbar functionality is available immediately
    (function () {
        // Global snackbar functionality
        window.snackbarTranslations = {
            copiedToClipboard:
                "{{ trans(key='snackbarCopiedToClipboard', lang=detected_lang) }}",
            copyFailed: "{{ trans(key='snackbarCopyFailed', lang=detected_lang) }}",
            success: "{{ trans(key='snackbarSuccess', lang=detected_lang) }}",
            error: "{{ trans(key='snackbarError', lang=detected_lang) }}",
            info: "{{ trans(key='snackbarInfo', lang=detected_lang) }}",
            warning: "{{ trans(key='snackbarWarning', lang=detected_lang) }}",
            closeNotification: "{{ trans(key='closeNotification', lang=detected_lang) }}",
            view: {{ trans(key='snackbarView', lang=detected_lang) | json_encode() | safe }},
            undo: {{ trans(key='snackbarUndo', lang=detected_lang) | json_encode() | safe }},
        };

        let snackbarCounter = 0;

        /**
         * Show a snackbar notification
         * @param {string} message - The message to display
         * @param {string} type - The type of notification (success, error, info, warning)
         * @param {number} duration - Duration in milliseconds (default: 4000)
         * @param {Object} [action] - { label, onClick }: - Optional
         *        single text action (View, Undo); runs then dismisses.
         */
        window.showSnackbar = function (
            message,
            type = "info",
            duration = 4000,
            action = null,
        ) {
            const container = document.getElementById("snackbar-container");
            if (!container) {
                console.warn("Snackbar container not found");
                return;
            }

            // Create unique ID for this snackbar
            const snackbarId = `snackbar-${++snackbarCounter}`;

            // Create snackbar element
            const snackbar = document.createElement("div");
            snackbar.id = snackbarId;
            snackbar.className = `snackbar snackbar--${type}`;
            snackbar.setAttribute(
                "role",
                type === "error" ? "alert" : "status",
            );

            // Create icon based on type
            let icon = "";
            switch (type) {
                case "success":
                    icon =
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"></path></svg>';
                    break;
                case "saved":
                    icon =
                        '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>';
                    break;
                case "unsaved":
                    icon =
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>';
                    break;
                case "error":
                    icon =
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';
                    break;
                case "warning":
                    icon =
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';
                    break;
                case "info":
                default:
                    icon =
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
                    break;
            }

            // One line: icon · message · [action] · close. No progress bar —
            // a countdown stripe reads as urgency, and these are receipts.
            snackbar.innerHTML = `
                <div class="snackbar__icon" aria-hidden="true">${icon}</div>
                <div class="snackbar__message"></div>
                ${action ? '<button type="button" class="snackbar__action"></button>' : ''}
                <button type="button" class="snackbar__close" aria-label="${window.snackbarTranslations.closeNotification}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            `;
            snackbar.querySelector(".snackbar__message").textContent = message;
            snackbar.querySelector(".snackbar__close").addEventListener("click", () => window.hideSnackbar(snackbarId));
            if (action) {
                const btn = snackbar.querySelector(".snackbar__action");
                btn.textContent = action.label;
                btn.addEventListener("click", () => {
                    window.hideSnackbar(snackbarId);
                    try { action.onClick(); } catch (e) { console.error(e); }
                });
            }

            // One receipt at a time: a newer toast replaces the older ones.
            Array.from(container.children).forEach((old) => window.hideSnackbar(old.id));

            // Add to container
            container.appendChild(snackbar);

            // Trigger entrance animation
            requestAnimationFrame(() => {
                snackbar.classList.add("snackbar--visible");
            });


            // Auto-hide after duration
            if (duration > 0) {
                setTimeout(() => {
                    window.hideSnackbar(snackbarId);
                }, duration);
            }
        };

        /**
         * Hide a specific snackbar
         * @param {string} snackbarId - The ID of the snackbar to hide
         */
        window.hideSnackbar = function (snackbarId) {
            const snackbar = document.getElementById(snackbarId);
            if (!snackbar) return;

            snackbar.classList.add("snackbar--hiding");

            setTimeout(() => {
                if (snackbar && snackbar.parentNode) {
                    snackbar.parentNode.removeChild(snackbar);
                }
            }, 300);
        };

        /**
         * Show success notification for clipboard copy
         */
        window.showCopySuccess = function () {
            window.showSnackbar(
                window.snackbarTranslations.copiedToClipboard,
                "success",
                3000,
            );
        };

        /**
         * Show error notification for clipboard copy failure
         */
        window.showCopyError = function () {
            window.showSnackbar(
                window.snackbarTranslations.copyFailed,
                "error",
                4000,
            );
        };

        // Clear all snackbars when page unloads
        window.addEventListener("beforeunload", function () {
            const container = document.getElementById("snackbar-container");
            if (container) {
                container.innerHTML = "";
            }
        });
    })(); // End IIFE
</script>
