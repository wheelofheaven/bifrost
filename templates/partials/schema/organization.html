<!-- Schema.org Organization - Enhanced for AI/LLM consumption -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": {{ config.extra.organization_id | default(value=config.base_url ~ '/#organization') | json_encode | safe }},
  "name": {{ config.title | json_encode | safe }},
  "alternateName": ["WoH", "Wheel of Heaven Project"],
  "url": {{ config.base_url | json_encode | safe }},
  "description": {{ config.description | json_encode | safe }},
  {% if config.extra.logo %}
  "logo": {
    "@type": "ImageObject",
    "url": {{ get_url(path=config.extra.logo) | json_encode | safe }},
    "width": 512,
    "height": 512
  },
  {% endif %}
  {% if config.extra.founding_date %}
  "foundingDate": {{ config.extra.founding_date | json_encode | safe }},
  {% endif %}
  "sameAs": [
    {% if config.extra.social_links %}
      {% for link in config.extra.social_links %}
    {{ link | json_encode | safe }}{% if not loop.last %},{% endif %}
      {% endfor %}
    {% endif %}
  ],
  {% if config.extra.knows_about %}
  "knowsAbout": [
    {% for topic in config.extra.knows_about %}
    {{ topic | json_encode | safe }}{% if not loop.last %},{% endif %}
    {% endfor %}
  ],
  {% endif %}
  "areaServed": "Worldwide",
  "slogan": {{ trans(key='tagline', lang=detected_lang) | default(value='Mapping our engineered origins with evidence.') | json_encode | safe }},
  "knowsLanguage": ["en", "de", "fr", "es", "ru", "ja", "zh", "zh-Hant", "ko", "he"],
  "email": "contact@wheelofheaven.world",
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "customer support",
    "availableLanguage": ["English", "German", "French", "Spanish", "Russian", "Japanese", "Chinese", "Traditional Chinese", "Korean", "Hebrew"]
  }
}
</script>
