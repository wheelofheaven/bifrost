<!-- Schema.org ScholarlyArticle - For Explainer pages with references -->
{% set about_url = config.base_url ~ '/about/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ScholarlyArticle",
  "@id": "{{ current_url | safe }}",
  "headline": {{ page.title | json_encode | safe }},
  "description": {{ page.description | default(value='') | json_encode | safe }},
  "abstract": {{ page.description | default(value='') | json_encode | safe }},
  "url": "{{ current_url | safe }}",
  {% if page.extra.header_image %}
  "image": {
    "@type": "ImageObject",
    "url": {{ get_url(path=page.extra.header_image) | json_encode | safe }},
    "width": 1200,
    "height": 630
  },
  {% endif %}
  {% if page.extra.category %}
  "articleSection": {{ page.extra.category | json_encode | safe }},
  "keywords": [{{ page.extra.category | json_encode | safe }}, "Wheel of Heaven", "Ancient Astronaut Theory"],
  {% endif %}
  "author": {
    "@type": "{{ config.extra.author_type | default(value='Organization') }}",
    "name": {{ page.extra.author | default(value=config.extra.author) | default(value=config.title) | json_encode | safe }},
    "url": {{ about_url | json_encode | safe }}
  },
  "publisher": {
    "@type": "Organization",
    "@id": {{ config.extra.organization_id | default(value=config.base_url ~ '/#organization') | json_encode | safe }},
    "name": {{ config.title | json_encode | safe }},
    {% if config.extra.logo %}
    "logo": {
      "@type": "ImageObject",
      "url": {{ get_url(path=config.extra.logo) | json_encode | safe }}
    }
    {% endif %}
  },
  {% if page.date %}
  "datePublished": "{{ page.date | date(format='%Y-%m-%d') }}",
  {% endif %}
  {% if page.updated %}
  "dateModified": "{{ page.updated | date(format='%Y-%m-%d') }}",
  {% endif %}
  {% if page.reading_time %}
  "timeRequired": "PT{{ page.reading_time }}M",
  {% endif %}
  {% if page.extra.references %}
  "citation": [
    {% for ref in page.extra.references %}
    {
      "@type": "CreativeWork",
      "name": {{ ref.title | default(value=ref.id) | default(value='') | json_encode | safe }}
      {% if ref.author %},
      "author": {
        "@type": "Person",
        "name": {{ ref.author | json_encode | safe }}
      }
      {% endif %}
      {% if ref.publication %},
      "publisher": {{ ref.publication | json_encode | safe }}
      {% endif %}
      {% if ref.date %},
      "datePublished": {{ ref.date | json_encode | safe }}
      {% endif %}
      {% if ref.url %},
      "url": {{ ref.url | json_encode | safe }}
      {% elif ref.id %},
      "identifier": {{ ref.id | json_encode | safe }}
      {% endif %}
    }{% if not loop.last %},{% endif %}
    {% endfor %}
  ],
  {% endif %}
  "inLanguage": "{{ detected_lang }}",
  "isAccessibleForFree": true,
  "license": "https://creativecommons.org/publicdomain/zero/1.0/"
}
</script>
