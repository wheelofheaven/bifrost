<!-- Schema.org Event - For Timeline age entries -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Event",
  "@id": "{{ current_url | safe }}",
  "name": {{ page.title | json_encode | safe }},
  "description": {{ page.description | default(value='') | json_encode | safe }},
  "url": "{{ current_url | safe }}",
  {% if page.extra.start_year %}
  "startDate": {{ page.extra.start_year | json_encode | safe }},
  {% endif %}
  {% if page.extra.end_year %}
  "endDate": {{ page.extra.end_year | json_encode | safe }},
  {% endif %}
  {% if page.extra.period %}
  "duration": {{ page.extra.period | json_encode | safe }},
  {% endif %}
  "location": {
    "@type": "Place",
    "name": "Earth",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "Global"
    }
  },
  {% if page.extra.symbol %}
  "additionalType": "HistoricalEvent",
  {% endif %}
  {% if page.extra.genesis_interpretation %}
  {% set gi_name = page.title ~ ' - Genesis Interpretation' %}
  "about": {
    "@type": "Thing",
    "name": {{ gi_name | json_encode | safe }},
    "description": {{ page.extra.genesis_interpretation | truncate(length=300) | json_encode | safe }}
  },
  {% endif %}
  {% if page.extra.genesis_day %}
  "identifier": {
    "@type": "PropertyValue",
    "propertyID": "genesis_day",
    "value": {{ page.extra.genesis_day | json_encode | safe }}
  },
  {% endif %}
  "organizer": {
    "@type": "Organization",
    "@id": {{ config.extra.organization_id | default(value=config.base_url ~ '/#organization') | json_encode | safe }},
    "name": {{ config.title | json_encode | safe }}
  },
  "eventStatus": "https://schema.org/EventScheduled",
  "eventAttendanceMode": "https://schema.org/OnlineEventAttendanceMode",
  "inLanguage": "{{ detected_lang }}",
  "isAccessibleForFree": true
}
</script>
