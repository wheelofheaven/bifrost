<!-- Schema.org NewsArticle - For Newsroom dispatches -->
{% set about_url = config.base_url ~ '/about/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "NewsArticle",
  "@id": "{{ current_url | safe }}",
  "headline": {{ page.title | json_encode | safe }},
  "description": {{ page.description | default(value='') | json_encode | safe }},
  "url": "{{ current_url | safe }}",
  "articleSection": "Newsroom",
  {% if page.extra.event_type %}
  "keywords": [{{ page.extra.event_type | json_encode | safe }}, "Wheel of Heaven", "Newsroom"],
  {% else %}
  "keywords": ["Wheel of Heaven", "Newsroom"],
  {% endif %}
  {% if page.extra.header_image %}
  "image": {
    "@type": "ImageObject",
    "url": {{ get_url(path=page.extra.header_image) | json_encode | safe }},
    "width": 1200,
    "height": 630
  },
  {% endif %}
  "author": {
    "@type": "{{ config.extra.author_type | default(value='Organization') }}",
    "name": {{ page.extra.author | default(value=config.extra.author) | default(value=config.title) | json_encode | safe }},
    "url": {{ about_url | json_encode | safe }}
  },
  "publisher": {
    "@type": "Organization",
    "@id": {{ config.extra.organization_id | default(value=config.base_url ~ '/#organization') | json_encode | safe }},
    "name": {{ config.title | json_encode | safe }},
    {% if config.extra.logo %}
    "logo": {
      "@type": "ImageObject",
      "url": {{ get_url(path=config.extra.logo) | json_encode | safe }}
    }
    {% endif %}
  },
  {% if page.date %}
  "datePublished": "{{ page.date | date(format='%Y-%m-%dT%H:%M:%S') }}+00:00",
  {% endif %}
  {% if page.updated %}
  "dateModified": "{{ page.updated | date(format='%Y-%m-%dT%H:%M:%S') }}+00:00",
  {% endif %}
  {% if page.extra.sources %}
  "citation": [
    {% for src in page.extra.sources %}
    {
      "@type": "CreativeWork",
      "name": {{ src.title | json_encode | safe }}
      {% if src.outlet %},
      "publisher": {{ src.outlet | json_encode | safe }}
      {% endif %}
      {% if src.date %},
      "datePublished": {{ src.date | json_encode | safe }}
      {% endif %}
      {% if src.url %},
      "url": {{ src.url | json_encode | safe }}
      {% endif %}
    }{% if not loop.last %},{% endif %}
    {% endfor %}
  ],
  {% endif %}
  "inLanguage": "{{ detected_lang | default(value='en') }}",
  "isAccessibleForFree": true,
  "license": "https://creativecommons.org/publicdomain/zero/1.0/"
}
</script>
